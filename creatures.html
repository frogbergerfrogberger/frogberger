  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" type="button" aria-label="Close enlarged image">&times;</button>
    <button class="lightbox-nav prev" type="button" aria-label="Previous image">&#10094;</button>
    <img class="lightbox-image" id="lightboxImage" src="" alt="">
    <button class="lightbox-nav next" type="button" aria-label="Next image">&#10095;</button>
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>

  <footer>

  </footer>
  <script>
    const yearElement = document.getElementById("year");
    if (yearElement) {
      yearElement.textContent = new Date().getFullYear();
    }

    const galleryItems = Array.from(document.querySelectorAll(".work")).filter((item) => item.querySelector("img"));
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightboxImage");
    const lightboxCaption = document.getElementById("lightboxCaption");
    const closeButton = document.querySelector(".lightbox-close");
    const previousButton = document.querySelector(".lightbox-nav.prev");
    const nextButton = document.querySelector(".lightbox-nav.next");

    let currentIndex = 0;

    function openLightbox(index) {
      const image = galleryItems[index].querySelector("img");
      const caption = galleryItems[index].querySelector(".caption");

      currentIndex = index;
      lightboxImage.src = image.src;
      lightboxImage.alt = image.alt;
      lightboxCaption.textContent = caption ? caption.textContent : image.alt;

      lightbox.classList.add("is-open");
      lightbox.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function closeLightbox() {
      lightbox.classList.remove("is-open");
      lightbox.setAttribute("aria-hidden", "true");
      lightboxImage.src = "";
      document.body.style.overflow = "";
    }

    function showImage(direction) {
      currentIndex += direction;

      if (currentIndex < 0) {
        currentIndex = galleryItems.length - 1;
      }

      if (currentIndex >= galleryItems.length) {
        currentIndex = 0;
      }

      openLightbox(currentIndex);
    }

    galleryItems.forEach((item, index) => {
      const image = item.querySelector("img");
      image.addEventListener("click", () => openLightbox(index));
    });

    closeButton.addEventListener("click", closeLightbox);
    previousButton.addEventListener("click", () => showImage(-1));
    nextButton.addEventListener("click", () => showImage(1));

    lightbox.addEventListener("click", (event) => {
      if (event.target === lightbox) {
        closeLightbox();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (!lightbox.classList.contains("is-open")) return;

      if (event.key === "Escape") {
        closeLightbox();
      }

      if (event.key === "ArrowLeft") {
        showImage(-1);
      }

      if (event.key === "ArrowRight") {
        showImage(1);
      }
    });
  </script>
